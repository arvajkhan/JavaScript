<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f5f5;
            padding:20px;
        }

        input{
            width:100%;
            padding:12px;
            font-size:18px;
            margin-bottom:20px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            text-align:center;
        }

        img{
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:8px;
        }

        h4{
            margin-top:10px;
            font-size:16px;
        }
    </style>
</head>
<body>

<h1>Photo Gallery</h1>

<input type="text" class="search" placeholder="Search Photos">

<div class="cards"></div>

<script type="module" src="script.js"></script>

</body>
</html>
